# Example Kubernetes Secret for LUKS encryption passphrase
#
# This secret contains the passphrase used to encrypt volumes with LUKS.
# The passphrase should be base64-encoded.
#
# To create the secret:
#   echo -n "your-strong-passphrase-here" | base64
#   # Copy the output and replace <base64-encoded-passphrase> below
#
# Or create directly from command line:
#   kubectl create secret generic luks-passphrase \
#     --from-literal=encryptionPassphrase=your-strong-passphrase-here \
#     -n kube-system
#
apiVersion: v1
kind: Secret
metadata:
  name: luks-passphrase
  namespace: kube-system
type: Opaque
data:
  # Replace with your base64-encoded passphrase
  # Example: echo -n "MySecurePassword123!" | base64
  encryptionPassphrase: TXlTZWN1cmVQYXNzd29yZDEyMyE=
